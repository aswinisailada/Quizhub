<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Quiz Game</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url('color.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            color: #333;
            overflow: hidden; /* Prevent scrollbar from petals */
            flex-direction: column;
            min-height: 100vh; /* Ensure body takes full viewport height */
        }
        #header {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            z-index: 20; /* Ensure header is above other elements */
        }
        #webcam {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 160px;
            height: 120px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 10;
            transition: all 0.5s ease-in-out;
            transform: scaleX(-1); /* Mirror the webcam feed */
        }
        #webcam.hidden {
            width: 0;
            height: 0;
            opacity: 0;
            visibility: hidden;
            border: none; /* Remove border when hidden */
            box-shadow: none; /* Remove shadow when hidden */
        }
        .question-box {
            display: none; /* Hidden by default, shown when quiz starts */
            margin: auto; /* Center vertically and horizontally */
            max-width: 1000px;
            background: rgba(255,255,255,0.9);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            padding: 10px;
            flex-grow: 1; /* Allows it to take available space */
            flex-direction: column;
            justify-content: center; /* Center content vertically within the box */
        }
        .question {
            font-size: 1.6em;
            margin-bottom: 12px;
            color: #000;
            text-align: center;
        }
        .options label {
            display: block;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            background: #ffe4ec;
            cursor: pointer;
            transition: 0.3s;
            color: #333;
        }
        .options label:hover {
            background: #ffc2d1;
        }
        .options label input[type="radio"] {
            margin-right: 10px;
        }
        .correct { background: #a8e6cf !important; border: 2px solid green; }
        .incorrect { background: #f08080 !important; border: 2px solid red; }
        #timer-main, #remaining {
            font-size: 1em;
            padding: 5px 10px;
            background: rgba(255,255,255,0.8);
            border-radius: 6px;
            color: #333;
        }
        #question-timer {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2em;
            background: rgba(255,255,255,0.85);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            color: #333;
            display: none; /* Hidden by default */
            z-index: 20; /* Ensure timer is above buttons */
        }
        #prev-btn, #skip-btn {
            position: fixed;
            bottom: 10px;
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            display: none; /* Hidden by default */
            z-index: 20; /* Ensure buttons are above petals */
        }
        #prev-btn { left: 10px; background-color: #add8e6; }
        #skip-btn { right: 10px; background-color: #add8e6; }
        #scoreboard {
            display: none;
            text-align: center;
            font-size: 2.4em;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: auto; /* Center horizontally and vertically */
            padding: 40px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            max-width: 700px;
            position: relative;
            z-index: 50; /* Above everything else */
        }
        #scoreboard p { margin: 10px 0; }
        #back-to-homepage {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 0.6em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        #back-to-homepage:hover { background-color: #45a049; }
        .petals {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100; /* Above everything except potentially a modal/alert */
            overflow: hidden; /* Prevent scrollbar if petals go out of bounds */
        }
        .petal {
            width: 20px; height: 20px; background: pink;
            border-radius: 50%; position: absolute;
            animation: fall 10s linear infinite; /* Increased duration for slower fall */
            opacity: 0.8;
            pointer-events: none; /* Ensure petals don't interfere with clicks */
            box-shadow: 0 0 5px rgba(255,192,203,0.5); /* Soft glow */
        }
        @keyframes fall {
            0% { transform: translateY(-10%) translateX(0px) rotate(0deg); opacity:1; }
            100% { transform: translateY(100vh) translateX(50px) rotate(360deg); opacity:0; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="header">
        <div id="remaining">Total no. of Questions: 20</div>
        <div id="timer-main">Time Left: 10:00</div>
    </div>
    <video id="webcam" autoplay muted playsinline></video>
    <div id="question-timer">Question Time: 00:30</div>
    <button id="prev-btn">Previous</button>
    <button id="skip-btn">Skip</button>

    <div id="quiz" class="question-box">
        <div class="question" id="question-text"></div>
        <div class="options" id="options"></div>
    </div>

    <div id="scoreboard"></div>
    <div class="petals" id="petals"></div>

    <audio id="correctSound" src="rightanswer-95219.mp3" preload="auto"></audio>
    <audio id="wrongSound" src="buzzer-or-wrong-answer-20582.mp3" preload="auto"></audio>
    <audio id="popSound" src="hooray-36461.mp3" preload="auto"></audio>

    <script type="module">
        import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js";

        // --- DOM Elements ---
        const webcam = document.getElementById("webcam");
        const questionTextElement = document.getElementById("question-text");
        const optionsElement = document.getElementById("options");
        const quizBox = document.getElementById("quiz");
        const scoreboard = document.getElementById('scoreboard');
        const questionTimerDisplay = document.getElementById('question-timer');
        const mainTimerDisplay = document.getElementById('timer-main');
        const remainingQuestionsDisplay = document.getElementById('remaining');
        const prevBtn = document.getElementById('prev-btn');
        const skipBtn = document.getElementById('skip-btn');
        const petalsContainer = document.getElementById('petals');

        // --- Audio Elements ---
        const correctSound = document.getElementById('correctSound');
        const wrongSound = document.getElementById('wrongSound');
        const popSound = document.getElementById('popSound');

        // --- Quiz Variables ---
        let stream;
        let faceDetector;
        let lastVideoTime = -1;
        let currentQuestionIndex = 0;
        let score = 0;
        // New variables for detailed scoring
        let correctCount = 0;
        let wrongCount = 0;
        let unansweredCount = 0;

        let answeredQuestions = new Set(); // To track answered questions and prevent re-answering
        let questionTimerInterval;
        let mainTimerInterval;
        let quizActive = false; // Flag to control quiz state
        const QUESTION_TIME_LIMIT = 30; // seconds per question
        const TOTAL_QUIZ_TIME = 10 * 60; // 10 minutes in seconds
        let questionTimeLeft = QUESTION_TIME_LIMIT;
        let totalTimeLeft = TOTAL_QUIZ_TIME;

        // --- Quiz Questions (Now for Java) ---
        const questions = [
            {
                question: "Which of the following is NOT a Java keyword?",
                options: ["static", "volatile", "goto", "transient"],
                answer: "goto",
                status: "unanswered" // Add a status to each question
            },
            {
                question: "What is the primary purpose of the `finally` block in a Java try-catch-finally statement?",
                options: ["To execute code only if an exception occurs", "To execute code regardless of whether an exception occurs or not", "To catch specific types of exceptions", "To define a new exception type"],
                answer: "To execute code regardless of whether an exception occurs or not",
                status: "unanswered"
            },
            {
                question: "Which of the following access modifiers provides the most restrictive access?",
                options: ["public", "protected", "default (package-private)", "private"],
                answer: "private",
                status: "unanswered"
            },
            {
                question: "What will be the output of `System.out.println(10 / 3);` in Java?",
                options: ["3.333", "3", "3.0", "Error"],
                answer: "3",
                status: "unanswered"
            },
            {
                question: "Which interface should you implement to make a class's objects sortable by `Collections.sort()`?",
                options: ["Serializable", "Cloneable", "Comparator", "Comparable"],
                answer: "Comparable",
                status: "unanswered"
            },
            {
                question: "What is method overloading in Java?",
                options: ["Defining multiple methods with the same name but different return types", "Defining multiple methods with the same name but different parameter lists", "Overriding a method from a superclass", "Defining a method that calls itself"],
                answer: "Defining multiple methods with the same name but different parameter lists",
                status: "unanswered"
            },
            {
                question: "Which of these statements is true about `String` objects in Java?",
                options: ["They are mutable.", "They are stored in the heap memory.", "They are created using the `new` keyword only.", "They are primitive data types."],
                answer: "They are stored in the heap memory.",
                status: "unanswered"
            },
            {
                question: "What is the purpose of the `super` keyword in Java?",
                options: ["To refer to the current object's instance", "To call a method of the parent class or access a parent class's constructor", "To define a new superclass", "To declare a static variable"],
                answer: "To call a method of the parent class or access a parent class's constructor",
                status: "unanswered"
            },
            {
                question: "Which of the following is used for automatic garbage collection in Java?",
                options: ["`System.gc()`", "The programmer explicitly calls `delete`", "JVM's garbage collector thread", "Manual memory deallocation"],
                answer: "JVM's garbage collector thread",
                status: "unanswered"
            },
            {
                question: "Which collection class allows you to store unique elements and ensures no duplicates?",
                options: ["ArrayList", "LinkedList", "HashSet", "HashMap"],
                answer: "HashSet",
                status: "unanswered"
            },
            {
                question: "What is the output of the following Java code snippet?\n```java\nint x = 5;\nSystem.out.println(x++);\n```",
                options: ["5", "6", "Error", "undefined"],
                answer: "5",
                status: "unanswered"
            },
            {
                question: "In Java, what is the default value of a `boolean` variable?",
                options: ["true", "false", "null", "undefined"],
                answer: "false",
                status: "unanswered"
            },
            {
                question: "Which exception is thrown when an array is accessed with an illegal index?",
                options: ["NullPointerException", "ClassCastException", "ArrayIndexOutOfBoundsException", "IllegalArgumentException"],
                answer: "ArrayIndexOutOfBoundsException",
                status: "unanswered"
            },
            {
                question: "What is the purpose of the `static` keyword when applied to a method in Java?",
                options: ["It makes the method accessible only within the class.", "It indicates that the method belongs to the class itself, rather than to any specific instance of the class.", "It prevents the method from being overridden.", "It ensures the method is executed only once."],
                answer: "It indicates that the method belongs to the class itself, rather than to any specific instance of the class.",
                status: "unanswered"
            },
            {
                question: "Which of the following correctly defines an abstract class in Java?",
                options: ["`class MyClass { abstract void myMethod(); }`", "`public abstract class MyClass { abstract void myMethod(); }`", "`abstract class MyClass { void myMethod(); }`", "`public class abstract MyClass { abstract void myMethod(); }`"],
                answer: "`public abstract class MyClass { abstract void myMethod(); }`",
                status: "unanswered"
            },
            {
                question: "Which of these is NOT a principle of Object-Oriented Programming (OOP)?",
                options: ["Encapsulation", "Inheritance", "Polymorphism", "Compilation"],
                answer: "Compilation",
                status: "unanswered"
            },
            {
                question: "What is the entry point for execution of a Java application?",
                options: ["`main()` method", "Constructor", "First line of the class", "Any public method"],
                answer: "`main()` method",
                status: "unanswered"
            },
            {
                question: "Which operator is used to check for equality of two object references in Java?",
                options: ["`==`", "`.equals()`", "`<>`", "`!=`"],
                answer: "`==`",
                status: "unanswered"
            },
            {
                question: "What is the process of converting a primitive data type into its corresponding wrapper class object in Java called?",
                options: ["Unboxing", "Casting", "Autoboxing", "Parsing"],
                answer: "Autoboxing",
                status: "unanswered"
            },
            {
                question: "Which of the following is true about Java interfaces?",
                options: ["Interfaces can have constructors.", "A class can implement only one interface.", "Interfaces can contain method implementations in Java 8 and later.", "All methods in an interface must be declared as `public` and `abstract`."],
                answer: "Interfaces can contain method implementations in Java 8 and later.",
                status: "unanswered"
            }
        ];


        // --- MediaPipe Face Detection Functions ---
        async function createFaceDetector() {
            try {
                const filesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
                );
                faceDetector = await FaceDetector.createFromOptions(filesetResolver, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
                        delegate: "GPU" // or 'CPU'
                    },
                    runningMode: "VIDEO",
                    minDetectionConfidence: 0.7, // Increased confidence for better reliability
                    numFaces: 1 // Detect only one face
                });
                console.log("FaceDetector initialized.");
            } catch (error) {
                console.error("Failed to initialize FaceDetector:", error);
                alert("Failed to load face detection model. Please ensure you have a stable internet connection.");
                endQuizDueToViolation("Failed to load face detection. Check your internet connection.");
            }
        }

        async function startWebcam() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                webcam.srcObject = stream;
                webcam.onloadedmetadata = async () => {
                    await webcam.play(); // Ensure video starts playing
                    console.log("Webcam video loaded and playing.");
                    if (!faceDetector) {
                        await createFaceDetector();
                    }
                    if (faceDetector) { // Only proceed if detector was successfully created
                        quizActive = true;
                        detectFaces(); // Start face detection
                        startQuizTimers(); // Start quiz timers once webcam and detector are ready
                        loadQuestion(); // Load the first question
                        quizBox.style.display = 'flex'; // Show the quiz box
                        questionTimerDisplay.style.display = 'block'; // Show question timer
                        prevBtn.style.display = 'block'; // Show prev button
                        skipBtn.style.display = 'block'; // Show skip button
                    }
                };
            } catch (e) {
                alert("Webcam access is required to take this quiz. Please allow camera access and refresh the page. Error: " + e.message);
                console.error("Webcam access error:", e);
                endQuizDueToViolation("Webcam access denied. Quiz cannot be started.");
            }
        }

        function detectFaces() {
            if (!quizActive || !faceDetector || !webcam.srcObject || webcam.readyState < 2) {
                // If quiz is not active, stop requesting frames for detection
                return;
            }

            let startTimeMs = performance.now();
            if (lastVideoTime !== webcam.currentTime) {
                lastVideoTime = webcam.currentTime;
                try {
                    const detections = faceDetector.detectForVideo(webcam, startTimeMs);
                    if (detections && detections.detections.length > 1) {
                        alert("More than one person detected. The quiz will now end.");
                        endQuizDueToViolation("Multiple faces detected.");
                        return;
                    }
                } catch (error) {
                    console.error("Error during face detection:", error);
                    // This might happen if webcam stream is interrupted.
                    // Consider ending quiz or showing warning.
                    endQuizDueToViolation("An error occurred during face detection.");
                    return;
                }
            }
            requestAnimationFrame(detectFaces); // Continue detection
        }

        function stopWebcam() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            webcam.classList.add("hidden"); // Hide and collapse webcam element
            webcam.srcObject = null;
            if (faceDetector) {
                faceDetector.close();
                faceDetector = null;
            }
        }

        // --- Quiz State Management ---
        function endQuizDueToViolation(message) {
            if (!quizActive) return; // Prevent multiple calls if already terminated
            quizActive = false; // Set quiz to inactive
            clearInterval(questionTimerInterval);
            clearInterval(mainTimerInterval);
            stopWebcam(); // Close webcam
            hideQuizElements();
            showScoreboard(`Quiz Ended: ${message}`, true); // Pass true to indicate a termination
        }

        function hideQuizElements() {
            quizBox.style.display = 'none';
            questionTimerDisplay.style.display = 'none';
            prevBtn.style.display = 'none';
            skipBtn.style.display = 'none';
            mainTimerDisplay.style.display = 'none'; // Hide main timer as well
            remainingQuestionsDisplay.style.display = 'none'; // Hide remaining questions
        }

        // --- Quiz Logic Functions ---
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
        }

        function startQuizTimers() {
            // Main Quiz Timer
            mainTimerInterval = setInterval(() => {
                totalTimeLeft--;
                mainTimerDisplay.textContent = `Time Left: ${formatTime(totalTimeLeft)}`;
                if (totalTimeLeft <= 0) {
                    clearInterval(mainTimerInterval);
                    endQuizDueToViolation("Time's up for the entire quiz!");
                }
            }, 1000);

            // Start the first question timer
            startQuestionTimer();
        }

        function startQuestionTimer() {
            clearInterval(questionTimerInterval); // Clear any existing timer
            questionTimeLeft = QUESTION_TIME_LIMIT;
            questionTimerDisplay.textContent = `Question Time: ${formatTime(questionTimeLeft)}`;

            questionTimerInterval = setInterval(() => {
                questionTimeLeft--;
                questionTimerDisplay.textContent = `Question Time: ${formatTime(questionTimeLeft)}`;
                if (questionTimeLeft <= 0) {
                    clearInterval(questionTimerInterval);
                    // Automatically mark as unanswered and move to next question if time runs out
                    alert("Time's up for this question! Moving to the next.");
                    wrongSound.play();
                    // Mark current question as unanswered
                    if (!answeredQuestions.has(currentQuestionIndex)) {
                        questions[currentQuestionIndex].status = "unanswered";
                        // We increment unansweredCount only when we finalize scores in showScoreboard
                        // to avoid issues with users navigating back and forth.
                    }
                    answeredQuestions.add(currentQuestionIndex);
                    // Move to next question immediately
                    moveToNextQuestion();
                }
            }, 1000);
        }

        function loadQuestion() {
            if (!quizActive) return; // Don't load if quiz isn't active

            if (currentQuestionIndex >= questions.length) {
                showScoreboard("Quiz Complete!"); // All questions answered
                return;
            }

            // Update remaining questions count (only for truly unanswered questions yet)
            // This counts questions that haven't been touched (no status set yet or still 'unanswered')
            const remainingForQuiz = questions.filter((q, index) => !answeredQuestions.has(index)).length;
            remainingQuestionsDisplay.textContent = `Total no. of Questions: ${remainingForQuiz}`;


            const q = questions[currentQuestionIndex];
            questionTextElement.textContent = q.question;
            optionsElement.innerHTML = ''; // Clear previous options

            q.options.forEach(option => {
                const label = document.createElement('label');
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = 'answer';
                input.value = option;

                // If question has already been answered, disable options and show selection
                if (answeredQuestions.has(currentQuestionIndex)) {
                    input.disabled = true;
                    if (option === q.selectedAnswer) { // Check if this was the selected answer
                        input.checked = true;
                        if (option === q.answer) {
                            label.classList.add('correct');
                        } else {
                            label.classList.add('incorrect');
                        }
                    } else if (option === q.answer && q.status === "wrong") { // Highlight correct answer if user got it wrong
                        label.classList.add('correct');
                    }
                } else {
                    input.onclick = () => checkAnswer(option, q.answer, label);
                }

                label.appendChild(input);
                label.appendChild(document.createTextNode(option));
                optionsElement.appendChild(label);
            });

            // If question hasn't been answered yet, restart its specific timer
            if (!answeredQuestions.has(currentQuestionIndex)) {
                startQuestionTimer();
            } else {
                // If already answered, stop question timer and reset display
                clearInterval(questionTimerInterval);
                questionTimerDisplay.textContent = "Question Time: --:--"; // Indicate no active timer
            }
        }

        function checkAnswer(selectedOption, correctAnswer, labelElement) {
            if (!quizActive || answeredQuestions.has(currentQuestionIndex)) {
                return; // Prevent action if quiz inactive or already answered
            }

            // Disable all options for the current question
            Array.from(optionsElement.children).forEach(childLabel => {
                childLabel.querySelector('input').disabled = true;
            });

            // Store the selected answer
            questions[currentQuestionIndex].selectedAnswer = selectedOption;

            // Update question status
            if (selectedOption === correctAnswer) {
                score++;
                questions[currentQuestionIndex].status = "correct";
                labelElement.classList.add('correct');
                correctSound.play();
            } else {
                questions[currentQuestionIndex].status = "wrong";
                labelElement.classList.add('incorrect');
                wrongSound.play();
                // Highlight the correct answer if the user was wrong
                Array.from(optionsElement.children).forEach(childLabel => {
                    if (childLabel.querySelector('input').value === correctAnswer) {
                        childLabel.classList.add('correct');
                    }
                });
            }

            answeredQuestions.add(currentQuestionIndex); // Mark this question as answered
            clearInterval(questionTimerInterval); // Stop the current question timer

            // Move to the next question after a short delay
            setTimeout(() => {
                moveToNextQuestion();
            }, 1500); // 1.5 second delay for feedback
        }

        function moveToNextQuestion() {
            if (!quizActive) return;

            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showScoreboard("Quiz Complete!"); // All questions answered
            }
        }

        function moveToPreviousQuestion() {
            if (!quizActive) return;

            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function skipQuestion() {
            if (!quizActive) return;

            if (!answeredQuestions.has(currentQuestionIndex)) {
                // If question hasn't been answered, mark it as skipped/unanswered
                questions[currentQuestionIndex].selectedAnswer = "skipped"; // Use a specific value for skipped
                questions[currentQuestionIndex].status = "unanswered"; // Explicitly set as unanswered
                answeredQuestions.add(currentQuestionIndex);
            }
            moveToNextQuestion();
        }

        function showScoreboard(completionMessage, terminated = false) {
            quizActive = false; // Ensure quiz is marked inactive
            clearInterval(questionTimerInterval);
            clearInterval(mainTimerInterval);
            stopWebcam(); // Close webcam and hide it

            hideQuizElements(); // Hide all quiz-related UI

            // Recalculate counts based on the final status of each question
            correctCount = questions.filter(q => q.status === "correct").length;
            wrongCount = questions.filter(q => q.status === "wrong").length;
            // Unanswered questions are those not explicitly marked as correct or wrong
            unansweredCount = questions.length - (correctCount + wrongCount);


            let scoreMessage = `Your Score: ${score} / ${questions.length}`;
            let detailedScore = `
                <p>Correct: ${correctCount}</p>
                <p>Wrong: ${wrongCount}</p>
                <p>Unanswered: ${unansweredCount}</p>
            `;

            if (terminated) {
                scoreboard.innerHTML = `
                    <p style="color: yellow; font-size: 1.5em;">${completionMessage}</p>
                    <p>${scoreMessage}</p>
                    ${detailedScore}
                    <a id="back-to-homepage" href="homepage.html">Back to Homepage</a>
                `;
            } else {
                scoreboard.innerHTML = `
                    <p>${completionMessage}</p>
                    <p>${scoreMessage}</p>
                    ${detailedScore}
                    <a id="back-to-homepage" href="homepage.html">Back to Homepage</a>
                `;
                // Trigger petal animation only on successful completion
                startPetalAnimation();
            }
            scoreboard.style.display = 'block';
            popSound.play(); // Play a celebratory sound
        }

        // --- Petal Animation Logic ---
        function startPetalAnimation() {
            // Create a burst of petals
            for (let i = 0; i < 50; i++) { // Generate 50 petals
                createPetal();
            }
            // Continue adding petals for a duration
            let petalAnimationDuration = 10000; // 10 seconds
            let startTime = Date.now();
            const addMorePetals = () => {
                if (Date.now() - startTime < petalAnimationDuration) {
                    createPetal();
                    setTimeout(addMorePetals, Math.random() * 200); // Add new petal every 0-200ms
                }
            };
            addMorePetals();
        }

        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            petal.style.left = `${Math.random() * 100}vw`; // Random horizontal position
            petal.style.animationDuration = `${5 + Math.random() * 5}s`; // Random duration 5-10s
            petal.style.animationDelay = `-${Math.random() * 5}s`; // Start some petals already in motion
            petal.style.opacity = `${0.5 + Math.random() * 0.5}`; // Random opacity
            petal.style.transform = `scale(${0.5 + Math.random() * 0.5})`; // Random size
            petalsContainer.appendChild(petal);

            // Remove petal after animation to prevent DOM bloat
            petal.addEventListener('animationend', () => {
                petal.remove();
            });
        }


        // --- Event Listeners ---
        prevBtn.addEventListener('click', moveToPreviousQuestion);
        skipBtn.addEventListener('click', skipQuestion);

        // --- Tab/Window Visibility Detection ---
        document.addEventListener("visibilitychange", () => {
            if (document.hidden && quizActive) {
                // User switched tabs or minimized window
                alert("You switched tabs or minimized the window. The quiz will now end.");
                endQuizDueToViolation("Tab/Window switched.");
            }
        });


        // --- Initialization ---
        window.onload = () => {
            // Give a slight delay before starting webcam and quiz to ensure DOM is fully ready
            setTimeout(() => {
                startWebcam();
            }, 500);
        };

        // Stop webcam and clear timers if user navigates away or closes tab
        window.addEventListener('beforeunload', () => {
            // Only end quiz if it's currently active (prevents double termination messages)
            if (quizActive) {
                endQuizDueToViolation("User left the page.");
            }
        });
    </script>
</body>
</html>
