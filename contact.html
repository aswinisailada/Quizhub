
<!DOCTYPE html>
<html>
<head>
  <title>Contact Us - Quiz Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff0f5;
      margin: 0;
      padding: 50px;
      text-align: center;
      color: #333;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 18px;
      margin: 15px 0;
    }

    .contact-item img.icon {
      width: 24px;
      height: 24px;
    }

    .email-link {
      color: blue;
      text-decoration: none;
      font-weight: bold;
    }

    .email-link:hover {
      text-decoration: underline;
    }

    .contact-image {
      margin-top: 70px;
      width: 250px;
      height: auto;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>Contact Us</h1>

  <div class="contact-item">
    <img class="icon" src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Email Icon">
    <a class="email-link" href="mailto:support@quizhub.com?subject=Quiz%20Hub%20Support">
      support@quizhub.com
    </a>
  </div>

  <div class="contact-item">
    <img class="icon" src="https://cdn-icons-png.flaticon.com/512/597/597177.png" alt="Phone Icon">
    <span>+91-6301546440</span>
  </div>

  <!-- Contact illustration image -->
  <img class="contact-image" src="contact.jpg" alt="Contact Illustration">
<br>
<br>
<br>
<a class="back-link" href="homepage.html">BACK TO HOMEPAGE</a>
<br>
</body>
</html>
