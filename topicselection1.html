
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quiz Hub - Topic Wheel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: url('selection.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 20px;
      position: relative;
      min-height: 100vh;
    }
    #selectedAvatarDisplay {
      position: fixed;
      top: 15px;
      left: 15px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #007bff;
      object-fit: cover;
      background-color: white;
    }
    #wheel {
      border: 5px solid #333;
      border-radius: 50%;
      margin: 70px auto 20px auto;
      display: block;
      background-color: rgba(255, 255, 255, 0.85);
      transition: box-shadow 0.3s ease;
    }
    #spinBtn, #startQuizBtn {
      background-color: #6f42c1;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      margin: 15px;
      transition: background-color 0.3s ease;
    }
    #spinBtn:active, #startQuizBtn:active {
      background-color: #4a288c;
    }
    #startQuizBtn {
      display: none;
      animation: popIn 0.6s ease forwards;
    }
    @keyframes popIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Glow effect animation */
    @keyframes glowUp {
      0% {
        box-shadow: 0 0 0px rgba(111, 66, 193, 0);
      }
      50% {
        box-shadow: 0 0 25px 8px rgba(111, 66, 193, 0.8);
      }
      100% {
        box-shadow: 0 0 0px rgba(111, 66, 193, 0);
      }
    }
    #wheel.glow {
      animation: glowUp 1.2s ease-in-out 3;
    }
  </style>
</head>
<body>

  <img id="selectedAvatarDisplay" src="" alt="Selected Avatar" title="Your Selected Avatar" style="display:none;" />

  <h1 style="color: white; text-shadow: 2px 2px 4px #000;">🎡 Quiz Hub - Select Your Topic🎡 </h1>

  <canvas id="wheel" width="500" height="500"></canvas>
  <br />
  <button id="spinBtn">🎯 Spin the Wheel 🎉</button>
  <button id="startQuizBtn">🚀 Start Quiz</button>

  <audio id="spinSound" src="spinning.mp3" preload="auto"></audio>

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const topics = ['C', 'C++', 'Java', 'General Knowledge'];
    const colors = ['dodgerblue', 'orange', 'deeppink', 'indigo', 'yellow', 'green', 'violet'];
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = canvas.width / 2 - 10;
    const sliceAngle = (2 * Math.PI) / topics.length;
    let rotation = 0;
    let spinning = false;
    let selectedTopic = '';
    const spinBtn = document.getElementById('spinBtn');
    const startQuizBtn = document.getElementById('startQuizBtn');
    const spinSound = document.getElementById('spinSound');

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < topics.length; i++) {
        const startAngle = rotation + i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(
          centerX + Math.cos(startAngle + sliceAngle / 2) * radius * 0.6,
          centerY + Math.sin(startAngle + sliceAngle / 2) * radius * 0.6
        );
        ctx.rotate(startAngle + sliceAngle / 2 + Math.PI / 2);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(topics[i], 0, 0);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(centerX, centerY, 50, 0, 2 * Math.PI);
      ctx.fillStyle = '#6f42c1';
      ctx.fill();

      ctx.fillStyle = 'red';
      ctx.beginPath();
      ctx.moveTo(centerX - 15, 10);
      ctx.lineTo(centerX + 15, 10);
      ctx.lineTo(centerX, 40);
      ctx.closePath();
      ctx.fill();
    }

    drawWheel();

    function triggerMultiConfetti() {
      const duration = 3000;
      const interval = 250;
      let end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 50,
          startVelocity: 30,
          spread: 360,
          origin: {
            x: Math.random(),
            y: Math.random() - 0.2
          }
        });
        if (Date.now() < end) {
          setTimeout(frame, interval);
        }
      })();
    }

    spinBtn.addEventListener('click', () => {
      if (spinning) return;
      spinning = true;
      spinBtn.disabled = true;
      startQuizBtn.style.display = 'none';

      spinSound.currentTime = 0;
      spinSound.play();

      const spins = Math.floor(Math.random() * 5) + 5;
      const randomAngle = Math.random() * 2 * Math.PI;
      const totalRotation = spins * 2 * Math.PI + randomAngle;

      const duration = 4000;
      let startTime = null;

      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);

        rotation = (totalRotation * easeOut) % (2 * Math.PI);
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          spinning = false;
          spinSound.pause();

          selectedTopic = getWinningTopic();

          // Glow effect add here
          canvas.classList.add('glow');

          // Remove glow class after animation ends (3 loops * 1.2s)
          setTimeout(() => {
            canvas.classList.remove('glow');
          }, 3600);

          triggerMultiConfetti();

          setTimeout(() => {
            alert("🎉 You got: " + selectedTopic);
            startQuizBtn.style.display = 'inline-block';
            spinBtn.disabled = false;
          }, 800);
        }
      }

      requestAnimationFrame(animate);
    });

    function getWinningTopic() {
      const pointerAngle = 1.5 * Math.PI;
      let relativeAngle = pointerAngle - rotation;
      while (relativeAngle < 0) relativeAngle += 2 * Math.PI;
      let winningIndex = Math.floor(relativeAngle / sliceAngle) % topics.length;
      return topics[winningIndex];
    }

  startQuizBtn.addEventListener('click', () => {
  if (selectedTopic) {
    let page = '';

    if (selectedTopic === 'General Knowledge') {
      page = 'general knowledge.html'; // <-- Your file's exact name
    } else if (selectedTopic === 'C') {
      page = 'c.html';
    } else if (selectedTopic === 'C++') {
      page = 'cpp.html';
    } else if (selectedTopic === 'Java') {
      page = 'java.html';
    } else {
      // fallback in case you add more topics later
      page = selectedTopic.toLowerCase().replace(/\s+/g, '') + '.html';
    }

    window.location.href = page;
  }
});
    // Avatar display
    const selectedAvatarDisplay = document.getElementById('selectedAvatarDisplay');
    window.addEventListener('load', () => {
      const savedAvatar = localStorage.getItem('selectedAvatar');
      if (savedAvatar) {
        selectedAvatarDisplay.src = savedAvatar;
        selectedAvatarDisplay.style.display = 'block';
      }
    });
  </script>
</body>
</html>
