<!DOCTYPE html>
<html>
<head>
  <title>Quiz App</title>
  <style>
    body {
      text-align: center;
      font-family: 'Algerian', serif;
      color: deeppink;
      margin-top: 100px;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    button {
      width: 150px;
      height: 50px;
      font-size: 18px;
      padding: 10px 20px;
      margin: 10px;
      background-color: skyblue;
      color: black;
      cursor: pointer;
    }
    .avatar-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 10px;
      border: 3px solid transparent;
      cursor: pointer;
    }
    .footer {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px;
      margin-top: 90px;
    }
    .footer a {
      color: #00ffcc;
      margin: 0 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <marquee bgcolor="lavender" direction="right" behavior="alternate">
    <span style="font-family: 'Copperplate Gothic Bold'; font-size: 50px; color: dodgerblue;">WELCOME TO QUIZ HUB</span>
  </marquee>

  <p style="font-size: 30px;">Please login or register to continue</p>
  <button onclick="location.href='login.html'">Login</button>
  <button onclick="location.href='registration.html'">Register</button>

  <!-- Avatar Selection -->
  <div style="margin-top: 40px;">
    <h2 style="color:black;">Select Your Sticker</h2>
    <img src="girl1.jpg" class="avatar-img" onclick="selectAvatar(this)">
    <img src="avatar1.png" class="avatar-img" onclick="selectAvatar(this)">
    <img src="boy.jpg" class="avatar-img" onclick="selectAvatar(this)">
    <img src="avatar2.png" class="avatar-img" onclick="selectAvatar(this)">
    <img src="girl2.jpg" class="avatar-img" onclick="selectAvatar(this)">
    <img src="avatar3.png" class="avatar-img" onclick="selectAvatar(this)">
    <p id="avatarMsg" style="color:green; font-size:16px;"></p>
  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="about.html">About Us</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms&conditions.html">Terms & Conditions</a>
    <a href="contact.html">Contact Us</a>
    <p style="font-size:12px; margin-top:10px;">&copy; 2025 Quiz Hub</p>
  </div>

  <script>
    function selectAvatar(img) {
      const avatars = document.querySelectorAll('.avatar-img');
      avatars.forEach(a => a.style.borderColor = "transparent");
      img.style.borderColor = "#00ffcc";
      localStorage.setItem("selectedAvatar", img.src);
      document.getElementById("avatarMsg").innerText = "You selected your sticker!";
    }
  </script>

</body>
</html>
